services:
  karting-hub:
    image: ghcr.io/cobredev/karting-hub:latest
    # build: .   # uncomment to build from source instead of pulling
    container_name: karting-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Anyone with this token can upload/edit races. Friends only need the URL to view.
      ADMIN_TOKEN: change-me
    volumes:
      - /mnt/user/appdata/karting-hub:/data
