name: Test and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js && node --check public/app.js
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/karting-hub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Run the real image before publishing: it must start, drop root to 99:100, own /data and save a race.
      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: karting-hub:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name kh -e ADMIN_TOKEN=smoke -p 8080:8080 karting-hub:smoke
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/health
          docker exec kh grep -E '^Uid:\s+99\s' /proc/1/status
          test "$(docker exec kh stat -c %u:%g /data/races)" = "99:100"
          curl -fs -X PUT -H 'Authorization: Bearer smoke' -H 'Content-Type: application/json' \
            -d '{"id":"smoke","name":"Smoke","karts":[]}' localhost:8080/api/races/smoke
          curl -fs localhost:8080/api/races | grep -q '"id":"smoke"'
          docker logs kh

      - name: Build (and push unless this is a pull request)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
