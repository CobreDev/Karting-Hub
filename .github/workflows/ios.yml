name: iOS app

# Tests the Swift app when ios/ changes, and builds and publishes the unsigned .ipa for ios-v* tags.
# Tag pushes ignore the paths filter, so every ios-v* tag runs.
on:
  push:
    branches: [main]
    tags: ['ios-v*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in ios/project.yml
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 27.2 or newer
        run: |
          # the app is built with the iOS 27.2 SDK
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_(27\.([2-9]|[1-9][0-9])|2[89]|[3-9][0-9])' | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no Xcode 27.2 or newer. Installed: $(ls /Applications | grep Xcode | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate --quiet
        working-directory: ios
      - name: Run the Swift tests
        working-directory: ios
        run: |
          # any iPhone simulator on an iOS 27.1+ runtime
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[]
            | select(.key | test("iOS-(27-([1-9])|2[89]|[3-9][0-9])"))
            | .value[] | select(.name | startswith("iPhone")) | .udid' | head -1)
          if [ -z "$udid" ]; then echo "::error::No iPhone simulator on iOS 27.1 or newer"; exit 1; fi
          xcodebuild -project KartingHub.xcodeproj -scheme KartingHub -destination "id=$udid" test -quiet

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/ios-v') || inputs.publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 27.2 or newer
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_(27\.([2-9]|[1-9][0-9])|2[89]|[3-9][0-9])' | sort -V | tail -1 || true)
          [ -n "$xcode" ] || { echo "::error::This runner has no Xcode 27.2 or newer"; exit 1; }
          sudo xcode-select -s "$xcode"
      - run: brew install xcodegen
      - name: Check the version
        id: version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' ios/project.yml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "ios-v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match MARKETING_VERSION $version in ios/project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the unsigned .ipa
        run: ios/scripts/build-ipa.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="ios-v$VERSION"
          ipa="ios/build/release/Karting-Hub-v$VERSION.ipa"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ipa" --clobber
          else
            gh release create "$tag" "$ipa" --target "$GITHUB_SHA" --title "Karting Hub for iOS $VERSION" --notes "$(cat <<EOF
          Karting Hub for iOS $VERSION, for iPhone and iPad on iOS 27.1 or later.

          **Installing:** \`Karting-Hub-v$VERSION.ipa\` is unsigned. Install it with a sideloading tool such as AltStore or Sideloadly, which signs it with your own Apple ID, or build it from source with Xcode (see \`ios/README.md\`). With a free Apple ID, apps installed this way need refreshing every 7 days.
          EOF
          )"
          fi
